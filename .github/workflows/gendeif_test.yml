name: Node CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm install

      - run: ls -l node_modules/.bin
      - run: file node_modules/.bin/eslint
      - run: node -v
      - run: npm -v
      - run: npx eslint --version

      - run: make lint
      - run: make test